[project]
name = "chakravyuh"
version = "0.1.0"
description = "Policy-fuzzing multi-agent simulator for emergency telecom governance (ITU AI for Good Build-a-thon 5.0)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
# Fuzzing + tests. Needed for P4/P5 gates.
test = ["pytest>=8.0", "hypothesis>=6.100"]
# Demo UI. Needed for P8.
ui = ["streamlit>=1.33", "plotly>=5.20", "pandas>=2.2"]
# LLM + ITU reference vector KB. Optional: everything deterministic runs without these.
llm = ["litellm>=1.40"]
kb = ["chromadb>=0.5"]
all = [
    "pytest>=8.0", "hypothesis>=6.100",
    "streamlit>=1.33", "plotly>=5.20", "pandas>=2.2",
    "litellm>=1.40", "chromadb>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chakravyuh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "slow: shells out to a script in scripts/ and runs a full sweep (deselect with -m 'not slow')",
]
