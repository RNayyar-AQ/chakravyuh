  - id: IN-TCS-2024
    sha256: 16f93fbc5e1bbdbdee56b3b98a020e0d49e32f98b524ed8942ac8d6f7dc81494
    instrument: "Telecommunications (Telecom Cyber Security) Rules, 2024"
    gazette: "G.S.R. 720(E), 21 Nov 2024"
    jurisdiction: IN
    instrument_type: rules
    url: "https://www.thc.nic.in/Central%20Governmental%20Rules/Telecommunications%20(Telecom%20Cyber%20Security)%20Rules,%202024.pdf"
    official: false
    bilingual: true
    status: partial
    feeds: [P2, G3]
    partial_reason: >-
      The only copy obtained is a composite. Its first six pages are gazette pages 8-13 carrying
      TCS Rules 4-8 only; rules 1-3 and anything after rule 8 are absent. Its last three pages
      are gazette pages 5-7 of a DIFFERENT instrument (G.S.R. 771(E), 22 Oct 2025 - see
      IN-TCS-AMEND-2025). Searching this file for authentication terms returns 0 hits, but that
      result is WORTHLESS as evidence of absence because the file is missing most of the rules.
    blocks: >-
      P2 and G3 rest on the claim that the TCS Rules impose no duty to authenticate a direction.
      That claim CANNOT be upgraded from `secondary_source` until the complete notified text is
      held. This is the single highest-value document still missing.
    wanted_from:
      - "dot.gov.in - search 'Telecom Cyber Security Rules 2024 G.S.R. 720(E)'"
      - "egazette.gov.in - locate the 21 Nov 2024 Part II Sec 3(i) issue"

