# Primary source documents. Fetched, hashed and completeness-checked by scripts/fetch_sources.py.
#
# WHY EVERY ENTRY CARRIES A `must_contain` AND A `unit_count`
#   A PDF that downloads with HTTP 200 and has a text layer can still be the wrong document, a
#   partial extract, or two documents spliced together. All three happened on the first run of
#   this manifest, and one of them would have produced a confident FALSE finding:
#
#     - `thc.nic.in` served a composite: TCS Rules 2024 rules 4-8 ONLY, followed by pages of a
#       different notification. Searching it for "authenticate" returns 0 hits -- which would
#       have "confirmed" our negative finding using a document missing rules 1-3 and 9+.
#     - A guessed eGazette id (258074) returned a Gramin Bank pension regulation.
#
#   So a fetch is not trusted because it is a PDF. It is trusted because the text it yields
#   contains the strings only the real instrument contains, and because the number of units it
#   segments into matches the instrument's own count. Both are asserted here, per document.
#
# `status: held`    = downloaded and all checks pass
# `status: partial` = downloaded but incomplete; usable ONLY for what it provably contains,
#                     and NEVER for an absence claim
# `status: wanted`  = not yet obtained

