# CI: build the knowledge base, replay the demo, verify every ledger, run the tests.
# Deliberately offline-equivalent: no secret is configured, so if anything ever starts needing a
# provider credential this job is where it fails, not the demo.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CHAKRAVYUH_LLM_MODE: replay
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,ui,kb,api]"

      - name: Lint
        run: |
          pip install ruff
          ruff check app tests --select F,E9,B

      # The whole pipeline, in dependency order: sources, knowledge base, retrieval and adviser
      # evaluations, the demo under every pack, the fuzz campaigns, the ledger and tamper checks,
      # the rubric audit, and finally the web export. Running stages piecemeal here was how the
      # bundle came to look stale: the export cannot write a section whose artefact never got
      # built. The one stage needing the network stays off, which keeps this job offline.
      - name: Run the pipeline
        run: python app/scripts/showcase.py

      - name: Tests
        run: python -m pytest -q

      # The bundle is committed so Vercel can build without Python. That is only safe while it
      # is identical to a fresh run, so fail on any drift from what the pipeline just wrote.
      - name: The committed bundle must match a fresh export
        run: |
          if ! git diff --exit-code --stat -- app/web/public/data; then
            echo "::error::app/web/public/data is stale. Run 'make artefacts' and commit it."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/web/package-lock.json

      - name: Build the frontend
        working-directory: app/web
        run: |
          npm ci
          npm run lint
          npx tsc --noEmit
          npm run build

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chakravyuh-artefacts
          path: |
            docs/
            outputs/
            app/web/out/
